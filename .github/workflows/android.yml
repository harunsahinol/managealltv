name: Android player

on:
  push:
    paths:
      - "apps/player-android/**"
      - "packages/protocol/fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/player-android/**"
      - "packages/protocol/fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: player-core tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/player-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v4

      # player-core is a standalone JVM build; its tests read packages/protocol/fixtures.
      - name: player-core tests
        working-directory: apps/player-android/player-core
        run: ../gradlew test --stacktrace

      # The runner image ships the Android SDK (ANDROID_HOME); AGP fetches a missing platform itself.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: managealltv-player-debug
          path: apps/player-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-core-test-reports
          path: apps/player-android/player-core/build/reports/tests/
          if-no-files-found: ignore
