# Shared by the root (Android) build and the standalone player-core build
# (player-core/settings.gradle.kts imports this file explicitly).

[versions]
agp = "8.13.0"
# Latest stable Kotlin on the Gradle plugin portal / Maven Central (checked 2026-10-15). The
# serialization compiler plugin always has the same version as Kotlin.
kotlin = "2.4.21"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
# OkHttp 4.x keeps the Java-friendly single-artifact layout and supports API 21+.
okhttp = "4.12.0"
junit = "5.14.4"
media3 = "1.10.1"
androidx-core = "1.17.0"
androidx-activity = "1.11.0"
androidx-lifecycle = "2.9.4"
desugar-jdk-libs = "2.1.5"
junit4 = "4.13.2"

# Plain numbers read with libs.versions.<name>.get().toInt() in the app module.
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "24"
jvm-target = "17"

[libraries]
# --- player-core (pure JVM)
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

# --- Android app
# Substituted by the included build (includeBuild("player-core")), hence no version.
player-core = { module = "tv.managealltv:player-core" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
# Android local unit tests run on JUnit 4 unless a JUnit 5 Android plugin is added.
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
