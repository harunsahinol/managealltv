org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The wrapper is pinned to Gradle 8.14.3 (project decision); Kotlin 2.4 only announces that a later
# Kotlin will require 8.14.4. Remove this line when the wrapper is upgraded.
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
